  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色：墨松绿（实验室玻璃器皿般的沉静生长感） === */
      --color-primary:              #0E6A5F;
      --color-primary-container:    #D9ECE7;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖纸白 × 纯白卡片） === */
      --color-background:                 #F6F5F2;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FFFFFF;
      --color-surface-container:          #EFEEE9;
      --color-surface-container-high:     #E7E6E0;
      --color-surface-container-highest:  #E0DFD9;
      /* === 文字 === */
      --color-on-surface:           #1C2321;
      --color-on-surface-variant:   #59635E;
      /* === 功能色 === */
      --color-success:  #1E8E5A;
      --color-error:    #C83E33;
      --color-warning:  #B57A0A;
      /* === 边框（Ghost Border 基底） === */
      --color-outline:          #C6C4BC;
      --color-outline-variant:  #D9D7D0;
      /* === 圆角 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.25rem;
      --radius-full: 9999px;
      /* === 阴影（克制柔和） === */
      --shadow-card:   0 1px 3px rgba(28,35,33,0.07), 0 1px 2px rgba(28,35,33,0.05);
      --shadow-float:  0 8px 24px rgba(28,35,33,0.10), 0 2px 6px rgba(28,35,33,0.05);
      --shadow-dialog: 0 20px 48px rgba(28,35,33,0.16), 0 4px 12px rgba(28,35,33,0.06);
      /* === 字体 === */
      --font-sans: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100vh; }
    .scrollbar-none { scrollbar-width: none; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

        <a href="evidence-cycle.html" class="nav-link px-2.5 sm:px-3 py-1.5 text-[13px] font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors whitespace-nowrap">证据回合</a>
